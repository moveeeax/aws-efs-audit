[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-efs-audit"
version = "0.1.0"
description = "Audit EFS file systems for missing lifecycle policies, disabled backups, single-AZ mount targets and encryption gaps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "efs", "storage", "audit", "cost", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.28"]
yaml = ["PyYAML>=6.0"]
dev = ["boto3>=1.28", "PyYAML>=6.0", "pytest>=7.4", "ruff>=0.5"]

[project.scripts]
aws-efs-audit = "aws_efs_audit.cli:main"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-efs-audit"
Issues = "https://github.com/moveeeax/aws-efs-audit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
