name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Audit the example payload
        run: |
          aws-efs-audit --from-json examples/prod.json --format markdown
          set +e
          aws-efs-audit --from-json examples/prod.json --fail-on critical >/dev/null
          code=$?
          set -e
          test "$code" = "1" || { echo "expected exit 1 on critical findings, got $code"; exit 1; }
          aws-efs-audit --from-json tests/fixtures/clean.json --fail-on critical >/dev/null
